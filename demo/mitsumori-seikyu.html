<header class="bar" id="bar"></header>
<main id="main"></main>
<footer class="app-foot">© 2026 株式会社Himorogi All rights reserved.　デモ版（複製・再配布はご遠慮ください）</footer>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="importFile" accept=".json,application/json" hidden>

<script>
"use strict";
const LICENSEE = "";
const LICENSE_LABEL = "デモ版";
/* ---------- 基本ユーティリティ ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = v => { const n = parseFloat(String(v ?? "").replace(/,/g, "")); return isFinite(n) ? n : 0; };
const fmt = n => Math.round(n).toLocaleString("ja-JP");
const yen = n => "¥" + fmt(n);
const fmtS = n => n < 0 ? "▲" + fmt(-n) : fmt(n);
const fmtQty = q => num(q).toLocaleString("ja-JP", {maximumFractionDigits: 2});
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const iso = d => d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
const today = () => iso(new Date());
const addDays = (s, n) => { const d = new Date(s + "T00:00"); d.setDate(d.getDate() + n); return iso(d); };
const endOfNextMonth = s => { const d = new Date(s + "T00:00"); return iso(new Date(d.getFullYear(), d.getMonth() + 2, 0)); };
const jpDate = s => { if (!s) return ""; const [y,m,d] = s.split("-"); return `${y}年${+m}月${+d}日`; };
const nl2br = s => esc(s).replace(/\n/g, "<br>");

const TYPES = {
  estimate: {label:"見積書", short:"見積", prefix:"EST", due:"有効期限", lead:"下記のとおりお見積り申し上げます。", amount:"お見積金額"},
  invoice:  {label:"請求書", short:"請求", prefix:"INV", due:"お支払期限", lead:"下記のとおりご請求申し上げます。", amount:"ご請求金額"}
};
const RATES = [{v:10, l:"10%"}, {v:8, l:"8%（軽減）"}, {v:0, l:"対象外"}];

const defaultData = () => ({
  app: "mitsumori-seikyu", version: 1,
  company: {name:"", person:"", zip:"", address:"", tel:"", email:"", regNo:"", bank:""},
  settings: {layout:"full"},
  docs: []
});

const S = {
  data: null, handle: null, dirty: false, view: "list",
  filter: "all", q: "", edit: null, editDirty: false, editIsNew: false,
  fsa: "showSaveFilePicker" in window
};

/* ---------- 計算（税率ごとに1回端数処理＝インボイス対応） ---------- */
function calc(d) {
  const m = new Map(); let subtotal = 0;
  for (const it of d.items) {
    const a = Math.round(num(it.qty) * num(it.price));
    const r = Number(it.rate);
    m.set(r, (m.get(r) || 0) + a); subtotal += a;
  }
  const discount = Math.max(0, Math.round(num(d.discount)));
  let dr = Number(d.discountRate ?? 10);
  if (discount && !m.has(dr) && m.size) dr = [...m.keys()][0];
  if (discount) m.set(dr, (m.get(dr) || 0) - discount);
  const groups = [10, 8, 0].filter(r => m.has(r) && m.get(r) !== 0).map(r => ({
    rate: r, base: m.get(r), tax: r ? Math.trunc(m.get(r) * r / 100) : 0,
    label: r === 10 ? "10%対象" : r === 8 ? "8%対象（軽減税率）" : "消費税対象外"
  }));
  const tax = groups.reduce((s, g) => s + g.tax, 0);
  const net = subtotal - discount;
  return {subtotal, discount, discountLabel: d.discountLabel || "出精値引き", net, groups, tax, total: net + tax};
}

function nextNo(type, date, exceptId) {
  const pre = `${TYPES[type].prefix}-${(date || today()).slice(0,4)}-`;
  let max = 0;
  for (const d of S.data.docs) {
    if (d.id === exceptId || !d.no || !d.no.startsWith(pre)) continue;
    max = Math.max(max, parseInt(d.no.slice(pre.length), 10) || 0);
  }
  return pre + String(max + 1).padStart(4, "0");
}

/* ---------- 前回ファイルの記憶（IndexedDB） ---------- */
function idb() {
  return new Promise((res, rej) => {
    const r = indexedDB.open("mitsumori-app", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("kv");
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
}
async function kvGet(k) {
  try { const db = await idb(); return await new Promise(res => {
    const q = db.transaction("kv").objectStore("kv").get(k);
    q.onsuccess = () => res(q.result); q.onerror = () => res(null);
  }); } catch { return null; }
}
async function kvSet(k, v) {
  try { const db = await idb(); await new Promise(res => {
    const tx = db.transaction("kv", "readwrite"); tx.objectStore("kv").put(v, k);
    tx.oncomplete = res; tx.onerror = res;
  }); } catch {}
}

/* ---------- ファイル保存・読込 ---------- */
const FTYPES = [{description:"見積・請求データ", accept:{"application/json":[".json"]}}];
const LS_KEY = "mitsumori-seikyu-data";

function parseData(text) {
  try {
    const d = JSON.parse(text);
    if (!d || !Array.isArray(d.docs)) throw new Error();
    d.company = {...defaultData().company, ...(d.company || {})};
    d.settings = {...defaultData().settings, ...(d.settings || {})};
    return d;
  } catch {
    alert("このファイルは見積・請求データとして読み込めません。");
    return null;
  }
}

async function save() {
  if (S.handle) {
    try {
      const w = await S.handle.createWritable();
      await w.write(JSON.stringify(S.data, null, 2)); await w.close();
      S.dirty = false;
    } catch (e) {
      S.dirty = true;
      alert("ファイルに保存できませんでした。「自社情報・データ」からバックアップを書き出してください。\n" + e.message);
    }
  } else {
    try { localStorage.setItem(LS_KEY, JSON.stringify(S.data)); S.dirty = false; }
    catch { S.dirty = true; alert("ブラウザ内に保存できませんでした。バックアップを書き出してください。"); }
  }
  updateStatus();
}

async function createFile() {
  try {
    const h = await showSaveFilePicker({suggestedName:"見積請求データ.json", types:FTYPES});
    S.handle = h; S.data = defaultData();
    await save(); await kvSet("handle", h);
    S.view = "settings"; render();
    toast("データファイルを作成しました。まず自社情報を入力してください");
  } catch (e) { if (e.name !== "AbortError") alert("作成できませんでした。\n" + e.message); }
}
async function openFile() {
  if (!confirmLeaveEdit()) return;
  try {
    const [h] = await showOpenFilePicker({types:FTYPES});
    await loadFrom(h);
  } catch (e) { if (e.name !== "AbortError") alert("開けませんでした。\n" + e.message); }
}
async function reopenLast() {
  const h = await kvGet("handle"); if (!h) return;
  try {
    let p = await h.queryPermission({mode:"readwrite"});
    if (p !== "granted") p = await h.requestPermission({mode:"readwrite"});
    if (p !== "granted") { alert("ファイルへのアクセスが許可されませんでした。"); return; }
    await loadFrom(h);
  } catch (e) {
    alert("前回のファイルを開けませんでした。移動・削除された可能性があります。「データファイルを開く」から選び直してください。");
  }
}
async function loadFrom(h) {
  const text = await (await h.getFile()).text();
  const d = parseData(text); if (!d) return;
  try { await h.requestPermission({mode:"readwrite"}); } catch {}
  S.handle = h; S.data = d; S.dirty = false; S.edit = null; S.editDirty = false;
  await kvSet("handle", h);
  S.view = "list"; render();
  toast(`「${h.name}」を開きました`);
}

function exportBackup() {
  const blob = new Blob([JSON.stringify(S.data, null, 2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `見積請求バックアップ_${today().replace(/-/g,"")}.json`;
  a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast("バックアップを書き出しました");
}
$("#importFile").addEventListener("change", async e => {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  const d = parseData(await f.text()); if (!d) return;
  if (S.data && !confirm(`現在のデータ（書類 ${S.data.docs.length} 件）を、バックアップの内容（書類 ${d.docs.length} 件）で置き換えます。よろしいですか？`)) return;
  S.data = d; S.edit = null; S.editDirty = false;
  await save(); S.view = "list"; render(); toast("バックアップを読み込みました");
});

/* ---------- 画面 ---------- */
function render() {
  $("#bar").innerHTML = viewBar();
  updateStatus();
  const m = $("#main");
  if (!S.data) { kvGet("handle").then(h => { m.innerHTML = viewStart(h); }); return; }
  if (S.view === "edit" && S.edit) { m.innerHTML = viewEdit(); renderItems(); }
  else if (S.view === "settings") m.innerHTML = viewSettings();
  else { S.view = "list"; m.innerHTML = viewList(); }
  window.scrollTo(0, 0);
}

function viewBar() {
  if (!S.data) return `<h1>見積・請求</h1><span class="lic">${esc(LICENSE_LABEL)}</span>`;
  const on = k => (S.view === k || (k === "list" && S.view === "edit")) ? "on" : "";
  return `<h1>見積・請求</h1><span class="lic">${esc(LICENSE_LABEL)}</span>

      <button class="${on("list")}" data-act="go" data-v="list">書類一覧</button>

function updateStatus() {
  const el = $("#status"); if (!el) return;

function printDoc(d) {
  const half = S.data.settings.layout === "half";
  const n = d.items.filter(it => it.name || num(it.price)).length;
  if (half && n > 8 && !confirm(`明細が${n}行あります。控え付き（上下2面）は8行までを想定しているため、下が切れる可能性があります。このまま印刷しますか？`)) return;
  $("#print-area").innerHTML = half
    ? `<div class="halfwrap"><div class="half">${docHTML(d, {half:true})}</div><div class="cut"><span>キリトリ</span></div><div class="half">${docHTML(d, {half:true, copy:true})}</div></div>`
    : docHTML(d);
  const old = document.title;
  document.title = `${TYPES[d.type].label}_${d.no}_${d.client || ""}`;
  window.print();
  document.title = old;
}

/* ---------- 操作 ---------- */
async function saveDoc() {
  const d = S.edit;
  if (!d.no.trim()) { alert("書類番号を入力してください。"); return; }
  if (S.data.docs.some(x => x.id !== d.id && x.no === d.no.trim())) { alert(`書類番号「${d.no}」はすでに使われています。`); return; }
  d.no = d.no.trim(); d.updatedAt = Date.now();
  const i = S.data.docs.findIndex(x => x.id === d.id);
  const copy = JSON.parse(JSON.stringify(d));
  if (i >= 0) S.data.docs[i] = copy; else S.data.docs.push(copy);
  S.editDirty = false;
  await save();
  if (!S.dirty) toast("保存しました");
  if (S.editIsNew) { S.editIsNew = false; render(); }
}

const actions = {
  create: createFile, open: openFile, reopen: reopenLast,
  local: () => {
    let d = null;
    try { const t = localStorage.getItem(LS_KEY); if (t) d = parseData(t); } catch {}
    S.data = d || defaultData(); S.view = S.data.company.name ? "list" : "settings"; render();
  },
  import: () => $("#importFile").click(),
  export: exportBackup,
  go: b => { if (S.view === b.v || !confirmLeaveEdit()) return; S.edit = null; S.editDirty = false; S.view = b.v; render(); },
  filter: b => { S.filter = b.v; render(); },
  new: b => { if (!S.data.company.name) toast("自社情報が未入力です。「自社情報・データ」から入力できます"); startEdit(newDoc(b.v), true); },
  edit: b => { const d = S.data.docs.find(x => x.id === b.id); if (d) startEdit(d, false); },
  printId: b => { const d = S.data.docs.find(x => x.id === b.id); if (d) printDoc(d); },
  print: () => printDoc(S.edit),
  saveDoc,
  reverseCalc: () => {
    const d = S.edit, before = calc({...d, discount: 0});
    if (!before.groups.length) { alert("先に明細を入力してください。"); return; }
    const v = prompt(`税込合計をいくらにしますか？\n（値引き前の税込合計：${yen(before.total)}）`, "");
    if (v === null) return;
    const T = Math.round(num(v)); if (!T) return;
    const g = before.groups.find(x => x.rate === Number(d.discountRate ?? 10)) || before.groups[0];
    const r = g.rate, target = T - (before.total - (g.base + g.tax));
    const f = X => X + (r ? Math.trunc(X * r / 100) : 0);
    let X = Math.floor(target * 100 / (100 + r));
    while (f(X) > target) X--;
    while (f(X + 1) <= target) X++;
    const D = g.base - X;
    if (D < 0) { alert("値引き前の合計より大きい金額は指定できません。"); return; }
    d.discount = D; d.discountRate = r; S.editDirty = true;
    const inp = document.querySelector('[data-f="discount"]'); if (inp) inp.value = D;
    const sel = document.querySelector('[data-f="discountRate"]'); if (sel) sel.value = String(r);
    renderTotals();
    const got = calc(d).total;
    toast(got === T ? `値引き ${yen(D)}（税抜）で、税込合計 ${yen(T)} になりました` : `端数の関係で、税込合計は ${yen(got)} になります`);
  },
  addItem: () => { S.edit.items.push(blankItem()); S.editDirty = true; renderItems();
    const ins = document.querySelectorAll('#itemRows input[data-k="name"]'); ins[ins.length - 1].focus(); },
  delItem: b => { S.edit.items.splice(+b.i, 1); if (!S.edit.items.length) S.edit.items.push(blankItem()); S.editDirty = true; renderItems(); },
  dup: () => {
    if (!confirmLeaveEdit()) return;
    const d = JSON.parse(JSON.stringify(S.edit)), date = today();
    Object.assign(d, {id:uid(), date, no:nextNo(d.type, date),
      due: d.type === "estimate" ? addDays(date, 30) : endOfNextMonth(date), createdAt:Date.now()});
    startEdit(d, true); toast("複製しました。保存すると新しい書類になります");
  },
  toInvoice: () => {
    if (!confirmLeaveEdit()) return;
    const d = JSON.parse(JSON.stringify(S.edit)), date = today();
    Object.assign(d, {id:uid(), type:"invoice", date, no:nextNo("invoice", date), due:endOfNextMonth(date), fromNo:S.edit.no, createdAt:Date.now()});
    startEdit(d, true); toast("見積の内容で請求書を作りました。確認して保存してください");
  },
  del: async () => {
    if (!confirm(`「${S.edit.no}」を削除します。元に戻せません。よろしいですか？`)) return;
    S.data.docs = S.data.docs.filter(x => x.id !== S.edit.id);
    S.edit = null; S.editDirty = false; S.view = "list";
    await save(); render(); toast("削除しました");
  },
  saveCompany: async () => { toast("デモ版では自社情報は変更できません"); return;
    document.querySelectorAll("[data-c]").forEach(el => S.data.company[el.dataset.c] = el.value.trim());
    await save(); if (!S.dirty) toast("自社情報を保存しました");
  }
};

document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  if (b.tagName === "TR" && e.target.closest("button")) return;
  e.preventDefault();
  const fn = actions[b.dataset.act]; if (fn) fn(b.dataset);
});

document.addEventListener("input", e => {
  const el = e.target;
  if (el.id === "q") { S.q = el.value; $("#rows").innerHTML = listRows(); return; }
  if (el.hasAttribute("data-layout")) {
    S.data.settings.layout = el.value; save();
    toast(el.value === "half" ? "上が相手用、下が控えになります" : "A4 1枚で印刷します");
    return;
  }
  if (!S.edit) return;
  if (el.dataset.f) {
    S.edit[el.dataset.f] = el.dataset.f === "discountRate" ? Number(el.value) : el.value;
    S.editDirty = true;
    if (el.dataset.f.startsWith("discount")) renderTotals();
  }
  else if (el.dataset.i !== undefined && el.dataset.k) {
    const it = S.edit.items[+el.dataset.i]; if (!it) return;
    it[el.dataset.k] = el.dataset.k === "rate" ? Number(el.value) : el.value;
    S.editDirty = true;
    const a = $("#amt" + el.dataset.i); if (a) a.textContent = fmtS(num(it.qty) * num(it.price));
    renderTotals();
  }
});

document.addEventListener("keydown", e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s") {
    e.preventDefault();
    if (S.view === "edit" && S.edit) saveDoc();
  }
});

let toastTimer;
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 2800);
}
