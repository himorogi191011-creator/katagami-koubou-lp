<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>見積・請求（デモ版）｜型紙工房</title>
<style>
:root{
  --ai:#1F3A5F; --ai-soft:#E8EEF5; --sumi:#23272E; --nezumi:#6B7480;
  --line:#D9DEE4; --paper:#FFFFFF; --ground:#F2F4F6; --shu:#B3412E; --kin:#F2B84B; --ok:#7FD1A8;
  --ui:"Yu Gothic UI","Yu Gothic","游ゴシック","Meiryo","Hiragino Sans",sans-serif;
  --mincho:"Yu Mincho","游明朝","Hiragino Mincho ProN","MS Mincho",serif;
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--ui);color:var(--sumi);background:var(--ground);font-size:15px;line-height:1.6}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ai);outline-offset:2px}

header.bar{background:var(--ai);color:#fff;display:flex;align-items:center;gap:20px;padding:10px 24px;flex-wrap:wrap}
header.bar h1{font-family:var(--mincho);font-size:19px;margin:0;font-weight:600;letter-spacing:.15em}
nav.tabs{display:flex;gap:4px}
nav.tabs button{background:transparent;color:#C9D5E3;border:0;padding:6px 14px;border-radius:4px;cursor:pointer}
nav.tabs button.on{background:rgba(255,255,255,.16);color:#fff}
nav.tabs button:focus-visible{outline-color:#fff}
.file{margin-left:auto;font-size:13px;display:flex;align-items:center;gap:8px;color:#DCE4EE}
.file .muted{opacity:.75}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block}
.dot.dirty{background:var(--kin)}

main{max-width:1080px;margin:0 auto;padding:28px 24px 80px}
h2.title{font-size:18px;margin:28px 0 8px}
h2.title:first-child{margin-top:0}
.hint{color:var(--nezumi);font-size:13px;margin:0 0 12px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:20px;margin-bottom:16px}

.btn{border:1px solid var(--line);background:#fff;padding:7px 16px;border-radius:4px;cursor:pointer;font-size:14px;white-space:nowrap}
.btn:hover{border-color:#B7C0CA}
.btn.primary{background:var(--ai);color:#fff;border-color:var(--ai)}
.btn.primary:hover{background:#2A4B76}
.btn.danger{color:var(--shu)}
.btn.small{padding:3px 10px;font-size:13px}
.btn.big{display:flex;flex-direction:column;align-items:flex-start;padding:14px 20px;font-size:16px;min-width:240px;text-align:left}
.btn.big small{font-size:12px;opacity:.75;margin-top:2px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;align-items:center}
.spacer{flex:1}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.seg{display:flex;border:1px solid var(--line);border-radius:4px;overflow:hidden;background:#fff}
.seg button{border:0;background:transparent;padding:7px 14px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--ai-soft);color:var(--ai);font-weight:700}
input[type=search]{padding:7px 10px;border:1px solid var(--line);border-radius:4px;min-width:240px;background:#fff}

/* 種別の小さな印 */
.seal{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border:2px solid currentColor;border-radius:3px;font-family:var(--mincho);font-weight:700;font-size:12px;line-height:1.05;writing-mode:vertical-rl;letter-spacing:.05em;flex:none}
.seal.estimate{color:var(--ai)}
.seal.invoice{color:var(--shu)}

.list{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.list th{font-size:12px;color:var(--nezumi);font-weight:400;text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);background:#FAFBFC}
.list td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.list tr:last-child td{border-bottom:0}
.list tbody tr{cursor:pointer}
.list tbody tr:hover{background:#F7F9FB}
.list .n{text-align:right;font-variant-numeric:tabular-nums}
.list .sub{color:var(--nezumi);font-size:13px}
.wrap{overflow-x:auto}
.empty{background:#fff;border:1px dashed #C3CBD4;border-radius:6px;padding:48px 24px;text-align:center;color:var(--nezumi)}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px 18px}
.grid .wide{grid-column:1/-1}
label{display:block;font-size:13px;color:var(--nezumi)}
label input,label select,label textarea{display:block;margin-top:4px;color:var(--sumi)}
input,select,textarea{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:4px;background:#fff}
textarea{resize:vertical}
.pair{display:flex;gap:8px}
.pair input{flex:1}
.pair select{width:90px;flex:none}

.edit-head{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.edit-head h2{margin:0;font-size:20px}

table.items{width:100%;border-collapse:collapse;min-width:720px}
table.items th{font-size:12px;color:var(--nezumi);font-weight:400;text-align:left;padding:4px 6px}
table.items td{padding:4px 6px}
table.items input,table.items select{padding:6px 7px}
table.items .amt{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;padding-right:10px}
table.items input.r{text-align:right}
.x{border:0;background:transparent;color:var(--nezumi);cursor:pointer;font-size:18px;line-height:1;padding:4px 8px;border-radius:4px}
.x:hover{color:var(--shu);background:#F8ECEA}

.totals{margin:16px 0 0 auto;max-width:380px;font-variant-numeric:tabular-nums}
.totals div{display:flex;justify-content:space-between;padding:4px 0}
.totals dt{color:var(--nezumi)}
.totals dd{margin:0}
.totals .sub{font-size:13px;padding-left:12px}
.totals .grand{border-top:2px solid var(--sumi);margin-top:6px;padding-top:8px;font-size:18px;font-weight:700}
.totals .grand dt{color:var(--sumi)}

.start{max-width:640px;margin:40px auto;background:#fff;border:1px solid var(--line);border-radius:6px;padding:36px}
.start h2{font-family:var(--mincho);font-size:26px;letter-spacing:.2em;margin:0 0 12px;font-weight:600}
.lic{font-size:12px;border:1px solid rgba(255,255,255,.45);padding:2px 12px;border-radius:999px;color:#DCE3EA;white-space:nowrap}
.app-foot{text-align:center;font-size:12px;color:var(--nezumi);padding:4px 20px 28px;line-height:1.7}
.ro{background:#F2F4F6!important;color:#6B7480!important;cursor:not-allowed}
.disc{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:flex-end;margin-top:14px;padding-top:14px;border-top:1px dashed var(--line)}
.disc label{width:190px}
.disc input.r{text-align:right}
.start .choices{display:flex;flex-direction:column;gap:10px;margin-top:24px}
.warn{background:#FFF6E5;border:1px solid #F0D9A8;padding:12px 14px;border-radius:4px;font-size:14px}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--sumi);color:#fff;padding:10px 18px;border-radius:4px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:90vw}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}

/* ===== 印刷用 ===== */
#print-area{display:none}
@page{size:A4;margin:11mm 12mm 10mm}
@media print{
  body{background:#fff}
  .demo-bar,header.bar,main,.toast,.app-foot{display:none!important}
  #print-area{display:block}
}
.doc{font-family:var(--ui);color:#000;font-size:10pt;line-height:1.5}
.doc h2{font-family:var(--mincho);text-align:center;font-size:22pt;letter-spacing:.8em;text-indent:.8em;margin:0 0 7mm;font-weight:600;border-bottom:1.5pt double #000;padding-bottom:2mm}
.doc .meta{text-align:right;font-size:9.5pt;margin-bottom:4mm}
.doc .top{display:flex;justify-content:space-between;gap:10mm;margin-bottom:6mm}
.doc .to{flex:1.2}
.doc .client{font-size:15pt;border-bottom:1pt solid #000;padding-bottom:1mm;margin-bottom:3mm}
.doc .client span{font-size:11pt;margin-left:3mm}
.doc .lead{margin:2mm 0 4mm}
.doc .amount{display:flex;align-items:baseline;justify-content:space-between;border:1.2pt solid #000;padding:2.5mm 4mm}
.doc .amount b{font-size:17pt;font-variant-numeric:tabular-nums}
.doc .from{flex:1;font-size:9.5pt}
.doc .from .co{font-size:12pt;font-weight:700;margin-bottom:1mm}
.doc .kv{margin-top:3mm;font-size:9.5pt}
.doc table{width:100%;border-collapse:collapse;margin-top:2mm}
.doc th{background:#EDEFF2;font-weight:400;font-size:9pt;border:.6pt solid #555;padding:1.5mm 2mm}
.doc td{border:.6pt solid #555;padding:1.6mm 2mm;height:7.5mm}
.doc .n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.doc .c{text-align:center}
.doc .sum{display:flex;justify-content:space-between;align-items:flex-start;gap:8mm;margin-top:3mm}
.doc .sum .note{font-size:8.5pt;flex:1}
.doc .sum table{width:85mm;margin:0}
.doc .sum th{text-align:left;width:50%}
.doc .sum .gt th,.doc .sum .gt td{font-weight:700;font-size:11pt}
.doc .box{border:.6pt solid #555;padding:2.5mm 3mm;margin-top:3mm;font-size:9.5pt;white-space:pre-wrap}
.doc .box:first-child{margin-top:0}
.doc .box b{display:block;font-size:8.5pt;font-weight:400;color:#444;margin-bottom:1mm;white-space:normal}
.doc .reduced{font-size:8.5pt;margin-bottom:1.5mm}
.doc .sum{align-items:stretch}
.doc .sum .note{display:flex;flex-direction:column}
.doc .sum > table{align-self:flex-start}
.doc .notebox{flex:1;border:.6pt solid #555;padding:2mm 3mm;min-height:42mm;font-size:9.5pt;white-space:pre-wrap;line-height:1.55}
.doc .notebox b{display:block;font-size:8.5pt;font-weight:400;color:#444;margin-bottom:1mm;white-space:normal}
.doc .bank{margin-top:2mm;padding-top:1.5mm;border-top:.5pt solid #999;white-space:pre-wrap}
.doc .bank b{display:block;font-weight:400;font-size:8pt;color:#444;white-space:normal}
.doc.half .notebox{min-height:26mm;font-size:7.5pt;padding:1.2mm 2mm;line-height:1.4}
.doc.half .notebox b{font-size:7pt;margin-bottom:.5mm}
.doc.half .bank{margin-top:1mm;padding-top:1mm}
.doc.half .bank b{font-size:6.5pt}
.doc{position:relative}
.doc::after{content:"デモ版";position:absolute;left:0;right:0;top:50%;transform:translateY(-50%) rotate(-24deg);text-align:center;font-family:var(--ui);font-weight:700;font-size:120pt;color:rgba(168,78,56,.16);pointer-events:none;white-space:nowrap;z-index:2}
.doc.half::after{font-size:72pt}
.demo-bar{background:#A84E38;color:#fff;padding:9px 24px;font-size:13.5px;line-height:1.6;display:flex;flex-wrap:wrap;gap:4px 16px;align-items:center}
.demo-bar b{font-weight:700;letter-spacing:.05em}
.demo-bar a{color:#fff;font-weight:700;margin-left:auto}
.doc .ctl{position:absolute;left:0;top:0;width:9mm;height:9mm;border:1pt solid #000;border-radius:1mm;display:flex;align-items:center;justify-content:center;font-family:var(--mincho);font-weight:700;font-size:12pt}

/* 上下2面（控え付き） */
.halfwrap > .half{height:135mm;overflow:hidden;display:flex;flex-direction:column;justify-content:center;justify-content:safe center}
.cut{height:5mm;position:relative}
.cut::before{content:"";position:absolute;left:-6mm;right:-6mm;top:50%;border-top:.5pt dashed #888}
.cut span{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#fff;padding:0 3mm;font-size:7pt;color:#666;letter-spacing:.3em}
.doc.half{font-size:8pt;line-height:1.4}
.doc.half h2{font-size:15pt;letter-spacing:.6em;text-indent:.6em;margin-bottom:3mm;padding-bottom:1mm}
.doc.half .meta{font-size:7.5pt;margin:0;position:absolute;right:0;top:0;line-height:1.35}
.doc.half .top{margin-bottom:2.5mm;gap:6mm}
.doc.half .client{font-size:11pt;margin-bottom:1.5mm}
.doc.half .client span{font-size:9pt}
.doc.half .lead{margin:1mm 0 2mm}
.doc.half .amount{padding:1.5mm 3mm}
.doc.half .amount b{font-size:13pt}
.doc.half .kv{margin-top:1.5mm;font-size:8pt}
.doc.half .from{font-size:7.5pt}
.doc.half .from .co{font-size:10pt}
.doc.half th{font-size:7.5pt;padding:.8mm 1.5mm}
.doc.half td{height:4.6mm;padding:.2mm 1.5mm;line-height:1.3}
.doc.half .sum{margin-top:2mm;gap:5mm}
.doc.half .sum table{width:70mm}
.doc.half .sum .gt th,.doc.half .sum .gt td{font-size:9pt}
.doc.half .box{padding:1.2mm 2mm;margin-top:0;font-size:7.5pt;line-height:1.35}
.doc.half .sum th,.doc.half .sum td{padding:.5mm 1.5mm;height:auto}
.doc.half .box b{font-size:7pt}
.doc.half .reduced{font-size:7pt;margin-bottom:1mm}
.doc.half .ctl{width:7mm;height:7mm;font-size:10pt}
.inline{display:flex;align-items:center;gap:6px;font-size:13px}
.inline select{width:auto;margin:0;padding:6px 8px}
/* 右端の罫線が印刷範囲で欠けないよう、内側に余白 */
.doc{padding:0 1mm 0 .6mm;box-sizing:border-box}
.doc table{border-collapse:collapse}
</style>
</head>
